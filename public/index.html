<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Справочная система ГУАП</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Справочная система ГУАП</h1>
            <p class="subtitle">Ответы на вопросы по локальным нормативным актам со ссылками на документ и пункт</p>
        </header>

        <form id="ask-form" class="ask-form">
            <textarea id="question" rows="2" maxlength="1000"
                placeholder="Например: сколько раз можно пересдавать экзамен?" required></textarea>
            <button id="ask-button" type="submit">Спросить</button>
        </form>

        <div class="examples">
            <span class="examples-label">Примеры:</span>
            <button type="button" class="example">Можно ли курить в университете?</button>
            <button type="button" class="example">Как восстановиться после отчисления?</button>
            <button type="button" class="example">Что будет, если не сдать сессию?</button>
        </div>

        <section id="result" class="result" hidden>
            <p id="status" class="status"></p>
            <div id="answer" class="answer"></div>
            <ul id="warnings" class="warnings"></ul>
            <div id="sources-block" class="sources-block" hidden>
                <h2>Источники</h2>
                <ol id="sources" class="sources"></ol>
            </div>
            <p id="meta" class="meta"></p>
        </section>

        <footer class="footer">
            Ответы формируются языковой моделью на основе найденных фрагментов документов.
            Проверяйте важную информацию по ссылкам на источники.
        </footer>
    </main>
</body>
</html>
